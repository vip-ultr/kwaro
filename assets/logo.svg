<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="kwaro logo">
  <g fill="#0B0D10">
    <!-- K vertical stem (also antenna base) -->
    <rect x="68" y="36" width="24" height="176"/>
    <!-- K upper arm (angular, mitred via polygon) -->
    <polygon points="92,116 204,60 204,84 92,140"/>
    <!-- K lower arm -->
    <polygon points="92,116 204,180 204,204 92,140"/>
    <!-- Antenna left branch: straight diagonal + square tip -->
    <polygon points="92,48 64,20 52,32 80,60"/>
    <rect x="44" y="12" width="16" height="16"/>
    <!-- Antenna right branch: straight diagonal + square tip -->
    <polygon points="92,48 120,20 132,32 104,60"/>
    <rect x="124" y="12" width="16" height="16"/>
  </g>
</svg>
