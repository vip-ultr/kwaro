<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="kwaro crosshair glyph">
  <g fill="#0B0D10">
    <!-- central diamond -->
    <polygon points="120,56 164,120 120,184 76,120"/>
  </g>
  <!-- four ticks at equal radius, consistent gap from diamond -->
  <g fill="#0B0D10">
    <rect x="113" y="22" width="14" height="20"/>
    <rect x="113" y="198" width="14" height="20"/>
    <rect x="22" y="113" width="20" height="14"/>
    <rect x="198" y="113" width="20" height="14"/>
  </g>
  <!-- the 'find': top tick is the lime hit -->
  <rect x="113" y="22" width="14" height="20" fill="#C6F432"/>
</svg>
