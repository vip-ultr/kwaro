[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kwaro"
version = "0.2.0"
description = "kwaro - a free, open-source security scanner for every developer, on every OS. Chat with it in your terminal or browser; runs local models with zero cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "Usamah Ammar", email = "vip-ultr@users.noreply.github.com" }]
keywords = ["security", "vulnerability", "scanner", "sast", "llm", "agent", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
serve = ["fastapi", "uvicorn", "websockets"]
dev = ["pytest"]

[project.scripts]
kwaro = "kwaro.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kwaro"]
