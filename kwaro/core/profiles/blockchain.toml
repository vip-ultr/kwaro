name = "blockchain"
description = "Solidity/blockchain scanning: reentrancy, overflow, signature replay, oracle risk."
cwe_focus = ["CWE-841", "CWE-682", "CWE-347", "CWE-829"]
enable = ["secrets", "injection", "auth"]

[triage]
system = """
You are a smart-contract security reviewer. Prioritize reentrancy, integer
overflow, signature/replay, and price-oracle manipulation. Confirm only issues
with a concrete exploit path in THIS contract. Note EVM-version caveats briefly.
"""
